spring:
  application:
    name: "gatewayserver"
  config:
    import: "optional:configserver:http://localhost:8071/"
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

management:
  endpoints:

    web:
      exposure:
        include: "*"
  info:
    env:
      enabled: true
  endpoint:
    gateway:
      access: unrestricted
info:
  app:
    name: "gatewayServer"
    description: "Lakkam  Bank gatewayServer Application"
    version: "1.0.0"

logging:
  level:
    com:
      lakkam:
        gatewayserver: DEBUG

